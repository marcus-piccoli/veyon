name: "Veyon Fix Source Bundle"

on:
  workflow_dispatch:
  push:
    branches:
      - "veyon-fix/fresh-dns-windows"
    paths:
      - "core/src/VncConnection.cpp"
      - "core/CMakeLists.txt"
      - "CMakeLists.txt"
      - "patches/libvncserver-mingw-unicode.patch"
      - "scripts/build-veyon-fix-windows.sh"
      - "BUILD_VEYON_FIX_WINDOWS.md"
      - ".github/workflows/veyon-fix-source-bundle.yml"

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate committed Veyon Fix source
        run: |
          git diff --check
          grep -q "DNS_QUERY_BYPASS_CACHE" core/src/VncConnection.cpp
          grep -q -- "-ldnsapi" core/CMakeLists.txt
          grep -q "CMAKE_SIZEOF_VOID_P EQUAL 8" CMakeLists.txt
          test -f patches/libvncserver-mingw-unicode.patch
          test -f scripts/build-veyon-fix-windows.sh

      - name: Prepare source directory
        run: |
          rm -rf dist
          mkdir -p dist/veyon-fix-4.11.2-source
          rsync -a \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='build-veyon-fix' \
            --exclude='.veyon-fix-cache' \
            --exclude='artifacts' \
            ./ dist/veyon-fix-4.11.2-source/

      - name: Create ZIP
        run: |
          cd dist
          zip -r -9 veyon-fix-4.11.2-source.zip veyon-fix-4.11.2-source

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: veyon-fix-4.11.2-source
          path: dist/veyon-fix-4.11.2-source.zip
          if-no-files-found: error
